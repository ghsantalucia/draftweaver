<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftWeaver</title>
</head>

<body>

  <header id="window-header">
    <!-- <div id="icon"><img src="public/icon.png"/></div> -->
  </header>

  <div class="app-container">

    <!-- Painel Lateral Esquerdo -->
    <aside class="sidebar">
      <div class="sidebar-header">

        <!-- Container Alinhado: Título do Livro + Ícone do Menu na mesma linha -->
        <div class="book-title-container">
          <select id="select-book" class="select-primary">
            <option value="" disabled selected>Clique para selecionar um livro</option>
          </select>

          <button id="btn-open-menu" class="menu-icon-btn" title="Configurações">
            <svg class="gear-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
          </button>
        </div>

      </div>

      <!-- Aba de Navegação (3 Abas) -->
      <nav class="sidebar-tabs">
        <button class="tab-btn" folder="notes">
          <i class="fa-regular fa-bookmark"></i>
          <span>Anotações</span>
        </button>
        <button class="tab-btn active" folder="content">
          <i class="fa-regular fa-pen-to-square"></i>
          <span>Escrita</span>
        </button>
        <button class="tab-btn" folder="assets">
          <i class="fa-regular fa-compass"></i>
          <span>Mundo</span>
        </button>
      </nav>

      <!-- Switch de Arquivos Avançados -->
      <div class="sidebar-controls">
        <span>Arquivos Avançados</span>
        <label class="switch">
          <input type="checkbox" id="mode-toggle" checked="false">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Conteúdo da Árvore de Arquivos -->
      <div id="file-tree" class="file-tree"></div>

      <!-- Footer do Assistente de IA -->
      <div id="ai-assistant-drawer" class="ai-assistant-drawer">
        <div id="ai-assistant-header" class="ai-assistant-header">
          <div class="ai-title-container">
            <span class="ai-sparkles-icon">✦</span>
            <span class="ai-title">Assistente de Escrita</span>
          </div>
          <button id="btn-toggle-ai" class="ai-toggle-btn" title="Expandir/Recolher Chat">▲</button>
        </div>

        <div class="ai-assistant-body" id="ai-body-container">

          <canvas id="ai-bg-canvas"></canvas>

          <div class="ai-chat-messages" id="ai-chat-messages">
            <!-- Mensagens de chat do assistente de IA -->
          </div>

          <div class="ai-chat-input-container">
            <div class="ai-input-wrapper">
              <!-- Campo de Texto -->
              <textarea id="ai-chat-input" placeholder="Digite uma instrução para a IA..." rows="2"></textarea>

              <!-- Barra Inferior de Ações Embutida (Estilo Gemini) -->
              <div class="ai-input-actions">
                <button id="btn-send-ai" class="btn-send-round" title="Enviar mensagem">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </aside>

    <!-- Área Principal do Editor -->
    <main class="editor-area">
      <!-- Ferramentas do framework -->
      <div class="editor-header">
        <span id="page-title">Nenhum arquivo selecionado</span>
        <div id="save-status-indicator" class="save-status saved" title="Status de salvamento automático">
          <i class="fas fa-check-circle"></i>
          <span class="status-text">Salvo</span>
        </div>
        <button id="btn-save" class="btn-save-gsap">
          <svg class="btn-border-svg">
            <rect class="btn-border-path" x="1" y="1" width="98.5%" height="93%" rx="7"
              vector-effect="non-scaling-stroke" />
          </svg>
          <span class="btn-text">Sincronizar</span>
        </button>
      </div>

      <!-- Editor TOASTUI -->
      <div id="markdown-editor"></div>

      <!-- OVERLAY REUTILIZÁVEL DO EDITOR (AI Lock / Nenhum Arquivo Selecionado) -->
      <div id="editor-overlay" class="editor-overlay hidden">
        <div class="overlay-content">
          <div id="editor-overlay-spinner" class="spinner"></div>
          <p id="editor-overlay-message">Aguarde...</p>
        </div>
      </div>
    </main>

    <!-- OVERLAY GLOBAL DE TELA CHEIA (Drawer / Modais / Dialogs) -->
    <div id="app-modal-overlay" class="app-modal-overlay hidden"></div>

    <!-- Container de Notificação Toast -->
    <div id="toast" class="toast hidden">
      <span id="toast-message"></span>
    </div>

    <!-- MENU Lateral (Drawer) -->
    <div id="settings-drawer" class="settings-drawer">
      <div class="drawer-header">
        <h3>Configurações</h3>
        <button id="btn-close-menu" class="close-btn">&times;</button>
      </div>

      <div class="drawer-content">
        <div class="sidebar-controls">
          <span>Modo Escuro</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

  </div>
  <!-- FIM App Container -->

  <!-- Ponto de entrada do Vite para carregar CSS e Scripts JS -->
  <script type="module" src="./renderer.js"></script>
</body>
</html>
