<!-- Aba de Navegação (3 Abas) -->
<nav class="explorer-tabs">
  <button class="tab-btn" folder="notes">
    <i class="fa-regular fa-bookmark"></i>
    <span>Anotações</span>
  </button>
  <button class="tab-btn active" folder="content">
    <i class="fa-regular fa-pen-to-square"></i>
    <span>Escrita</span>
  </button>
  <button class="tab-btn" folder="assets">
    <i class="fa-regular fa-compass"></i>
    <span>Mundo</span>
  </button>
</nav>

<!-- Switch de Arquivos Avançados -->
<div class="sidebar-controls">
  <span>Arquivos Avançados</span>
  <label class="switch">
    <input
      type="checkbox"
      id="mode-toggle"
      checked="false"
      event-click="advanced-mode:toggle"
    />
    <span class="slider"></span>
  </label>
</div>

<!-- Conteúdo da Árvore de Arquivos -->
<div id="file-tree" class="file-tree"></div>
